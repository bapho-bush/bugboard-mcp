[package]
name = "bugboard-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Read-only MCP server for the 1C bugboard."
publish = false

[workspace]
members = ["crates/e1c-element-rpc"]
default-members = [".", "crates/e1c-element-rpc"]
resolver = "3"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
e1c-element-rpc = { path = "crates/e1c-element-rpc", version = "0.3.0" }
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
rmcp = { version = "1.8.0", features = ["server", "transport-io", "transport-streamable-http-server"] }
schemars = "1.2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["macros", "net", "rt-multi-thread"] }

[package]
name = "e1c-element-rpc"
version = "0.3.0"
edition = "2024"
rust-version = "1.96"
description = "Wire-level request descriptors and response envelopes for 1C Element RPC."
license = "Apache-2.0 AND LicenseRef-Commons-Clause-1.0"
readme = "README.md"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls"] }
